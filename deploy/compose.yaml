# Usage (from this directory):
#   mkdir -p data && sudo chown 10001:10001 data   # the container runs as uid 10001
#   docker compose up -d --build
#   docker compose exec app rcm room add living-room --name "Living room"
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: room-climate-monitor:local
    ports:
      # Only this machine (and a reverse proxy on it) can reach the app.
      - "127.0.0.1:8080:8080"
      # Devices on the LAN post readings over plain HTTP. To accept them, also publish on the
      # server's LAN address; keep the line above so a reverse proxy on this host still works.
      # Never publish on 0.0.0.0 if the host faces the internet.
      # - "192.168.1.10:8080:8080"
    volumes:
      # Must be writable by uid 10001. A named volume (rcm-data:/data plus a top-level
      # `volumes: {rcm-data: {}}`) needs no chown.
      - ./data:/data
    # environment:
    #   TZ: Asia/Shanghai   # local time in `rcm room list`; the stored data is UTC either way
    restart: unless-stopped
