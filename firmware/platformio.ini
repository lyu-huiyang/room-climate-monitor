[platformio]
default_envs = supermini

; ESP32-C3 SuperMini on the device
[env:supermini]
platform = espressif32 @ 7.1.3
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
test_ignore = *

; Hardware-free code in lib/core, unit-tested on this machine
[env:native]
platform = native @ 1.2.1
build_flags = -std=gnu++17 -Wall -Wextra
