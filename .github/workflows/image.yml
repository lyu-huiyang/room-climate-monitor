name: image

# Publish the Docker image to ghcr.io for every release tag. Run it by hand with a tag to
# publish (or republish) the image of an existing release.
on:
  push:
    # Releases only: a pre-release tag such as v1.1.0-rc1 does not start a run.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v1.0.0
        required: true

permissions:
  contents: read

# One run at a time: each run decides from the tags on origin whether it may move the
# floating tags (X.Y, X, latest), so two overlapping runs could leave them on the older one.
concurrency:
  group: image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check the tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::not a release tag: $TAG"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: The tag matches the package version
        run: |
          grep -qx "__version__ = \"${TAG#v}\"" server/src/rcm/__init__.py ||
            { echo "::error::$TAG does not match server/src/rcm/__init__.py"; exit 1; }
      - name: Work out the image tags
        id: tags
        run: |
          version=${TAG#v}
          image=ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          newest=$(git ls-remote --tags --refs origin 'v*.*.*' | awk -F/ '{print $3}' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          tags="$image:$version"
          # Republishing an older release must not move the floating tags back to it.
          if [ "$TAG" = "$newest" ]; then
            tags="$tags,$image:${version%.*},$image:${version%%.*},$image:latest"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "$tags"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.2
      - name: Build amd64 for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          load: true
          tags: room-climate-monitor:smoke-amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build arm64 for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/arm64
          load: true
          tags: room-climate-monitor:smoke-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test both platforms
        env:
          VERSION: ${{ steps.tags.outputs.version }}
        run: |
          check() {
            local arch=$1 port=$2
            docker run -d --name "rcm-$arch" --platform "linux/$arch" -p "127.0.0.1:$port:8080" \
              "room-climate-monitor:smoke-$arch"
            # arm64 runs under QEMU here and starts more slowly.
            for _ in $(seq 120); do
              if body=$(curl -fsS "http://127.0.0.1:$port/api/health"); then
                echo "$arch: $body"
                python3 -c 'import json, os, sys; sys.exit(json.loads(sys.argv[1])["version"] != os.environ["VERSION"])' "$body" && return 0
                echo "::error::the $arch image reports another version"; return 1
              fi
              sleep 1
            done
            docker logs "rcm-$arch"
            echo "::error::the $arch image did not become healthy"
            return 1
          }
          check amd64 8080
          check arm64 8081
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=room-climate-monitor
            org.opencontainers.image.description=Self-hosted temperature and humidity monitor for every room at home
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://lyu-huiyang.github.io/room-climate-monitor/
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.revision=${{ steps.tags.outputs.revision }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
