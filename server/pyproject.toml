[project]
name = "rcm"
version = "1.1.0"
description = "Self-hosted room temperature and humidity monitor: API, CLI and web UI"
authors = [
    { name = "Lyu Huiyang" }
]
requires-python = "==3.14.*"
dependencies = [
    "fastapi==0.162.2",
    "uvicorn==0.54.0",
]

[project.scripts]
rcm = "rcm.cli:main"

[build-system]
requires = ["uv_build==0.13.6"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[tool.uv]
add-bounds = "exact"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
